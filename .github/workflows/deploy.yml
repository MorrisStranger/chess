name: Deploy

on:
  push:
    branches: [main, dev]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          path: main-src

      - name: Checkout dev
        uses: actions/checkout@v4
        with:
          ref: dev
          path: dev-src

      - name: Build site
        run: |
          mkdir -p _site/dev
          cp main-src/index.html main-src/stockfish-18-lite-single.js main-src/stockfish-18-lite-single.wasm _site/
          cp dev-src/index.html dev-src/stockfish-18-lite-single.js dev-src/stockfish-18-lite-single.wasm _site/dev/

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
