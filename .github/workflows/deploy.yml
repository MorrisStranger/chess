name: Deploy

on:
  push:
    branches: [main, dev]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          path: main-src

      - name: Checkout dev
        uses: actions/checkout@v4
        with:
          ref: dev
          path: dev-src

      - name: Build site
        run: |
          set -e
          mkdir -p _site/dev
          cp -r main-src/. _site/
          rm -rf _site/.git _site/.github _site/.claude _site/main-src _site/dev-src
          cp -r dev-src/. _site/dev/
          rm -rf _site/dev/.git _site/dev/.github _site/dev/.claude _site/dev/main-src _site/dev/dev-src
          echo "=== _site ===" && ls _site
          echo "=== _site/dev ===" && ls _site/dev

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
